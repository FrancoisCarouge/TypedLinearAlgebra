name: 'CppCheck'

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ 'master' ]
  schedule:
  - cron: '0 0 * * */5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install
      run: |
        ( cd /tmp
          git clone --depth 1 'https://github.com/danmar/cppcheck.git'
          cmake -S 'cppcheck' -B 'cppcheck/build'
          cmake --build 'cppcheck/build' --parallel 4
          sudo cmake --install 'cppcheck/build' )
        ( cd /tmp
          git clone --depth 1 'https://gitlab.com/libeigen/eigen'
          cmake -S 'eigen' -B 'eigen/build'
          cmake --build 'eigen/build' --parallel 4
          sudo cmake --install 'eigen/build' )
    - name: Verify
      run: |
        cppcheck \
          --check-level=exhaustive \
          --enable=all \
          --error-exitcode=1 \
          --suppress=internalAstError:support/eigen/fcarouge/eigen.hpp \
          --suppress=missingIncludeSystem \
          --suppress=noExplicitConstructor:include/fcarouge/typed_linear_algebra.hpp \
          --suppress=syntaxError:sample/au_std.cpp \
          --suppress=syntaxError:sample/mp_units_std.cpp \
          --suppress=unhandledChar \
          --suppress=unmatchedSuppression \
          --suppress=unusedFunction \
          --suppress=unusedStructMember:include/fcarouge/typed_linear_algebra_internal/format.tpp \
          --verbose \
          -I include \
          -I support/au \
          -I support/au_eigen \
          -I support/au_std \
          -I support/eigen \
          -I support/eigexed \
          -I support/kokkos \
          -I support/main \
          -I support/mp_units \
          -I support/mp_units_eigen \
          -I support/mp_units_std \
          -I support/nested_typed_eigen \
          .

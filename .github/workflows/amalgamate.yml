name: 'Amalgamate'

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ 'master' ]
  schedule:
  - cron: '0 0 * * */5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit
    - name: 'Checkout'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: 'Install: Latest CMake'
      uses: ssrobins/install-cmake@da13ba26f50a41d3b03cfe8ca7265903f04a8932 # v1.0.0
    - name: 'Configure'
      env:
        CXX: 'g++-15'
        CC: 'gcc-15'
      run: cmake -S . -B 'build'
    - name: 'Build'
      run: |
        cmake --build 'build' --verbose --parallel 4 --target \
          typed_linear_algebra_amalgamate_typed_linear_algebra_driver \
          typed_linear_algebra_amalgamate_typed_linear_algebra_mp_units_eigen_driver
    - name: 'Test'
      run: ctest --test-dir 'build' --output-on-failure --timeout 60 --parallel 4 -R 'amalgamate'

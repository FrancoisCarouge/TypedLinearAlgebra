name: 'ClangTidy'

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ 'master' ]
  schedule:
  - cron: '0 0 * * */5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  "Shard":
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1, 2, 3, 4, 5 ]
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: 'Install: Latest CMake'
      uses: ssrobins/install-cmake@da13ba26f50a41d3b03cfe8ca7265903f04a8932 # v1.0.0
    - name: 'Install: libc++'
      run: |
        sudo apt update
        sudo apt install -y "libc++-20-dev" "libc++abi-20-dev"
    - name: 'Configure'
      env:
        CXX: 'clang++-20'
        CC: 'clang-20'
      run: cmake -S . -B 'build' -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - name: Verify
      run: |
        FILES=`find . \
          -type f \( \
            -path './benchmark/*.cpp' -o \
            -path './sample/*.cpp' -o \
            -path './support/*.cpp' -o \
            -path './test/*.cpp' \) \
            ! -name '*_fail.cpp' | sort`
        SHARD_FILES=`echo "$FILES" | awk "NR % ${{ strategy.job-total }} == ${{ strategy.job-index }}"`
        run-clang-tidy -j 4 -p 'build' $SHARD_FILES
